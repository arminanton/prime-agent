# earlyoom drop-in (Deploy A). NOT applied by the fix branch. Install as
# /etc/default/earlyoom (this host's earlyoom.service uses EnvironmentFile=/etc/default/earlyoom
# and ExecStart=/bin/sh -c '/usr/local/bin/earlyoom $EARLYOOM_ARGS'), then restart earlyoom AFTER
# reviewing DEPLOY-A-RUNBOOK.md.
#
# earlyoom here is a HOST BACKUP ONLY. The PRIMARY guard is the per-daemon cgroup MemoryMax on
# prime-agent.slice (A.1): with a small MemorySwapMax the cgroup OOM-kills the daemon's largest
# process long before the whole host runs out. earlyoom only matters if the cgroup guard is off
# or something OUTSIDE the daemon eats the host.
#
# WHY the shipped config was inert for us (VERIFIED 2026-09-15):
#   Shipped: -m 6,3 -s 8,4 -r 3600 -p  with --prefer '(^|/)(node|copilot|...)$' and
#            --avoid '(^|/)(...|python3|...)$', wrapped by sh -c '... $EARLYOOM_ARGS'.
#   1. The single quotes inside EARLYOOM_ARGS are passed to earlyoom LITERALLY (the wrapper only
#      word-splits the expanded value; it does not strip inner quotes), so the regex earlyoom
#      compiled was "'(^|/)prime-agent$'" WITH quotes and matched no comm. Fixed below: NO inner
#      quotes (each regex has no whitespace, so it stays one argument).
#   2. Our daemon+workers have comm `prime-agent` and kernels have comm `python`, so --avoid
#      python3 and --prefer node matched nothing of ours.
#   3. -m 6 (~3.8G) never tripped: MemAvailable (page cache) stayed above 6% while swap was
#      exhausted, and BOTH the memory AND swap thresholds must cross for earlyoom to act.
#
# Retuned, ABSOLUTE thresholds in KiB (host: 60.4G RAM, 64G swap). Freeze day was MemAvailable
# ~4.6G with 0 free swap, so -M SIGTERM is set ABOVE 4.6G. -p makes earlyoom protect ITSELF
# (sets its own oom_score_adj low); it is NOT the prefer/avoid flag. --prefer targets `python`
# (kernels): a kernel is the right first victim; killing the `prime-agent` SUPERVISOR (often the
# largest process) would orphan every worker and trigger an adoption storm. The regex
# (^|/)python[0-9.]*$ matches python, python3, and python3.11 comms (a bare python$ missed
# python3). Kernels self-exit
# within ~1s of their worker via the repl owner-watchdog. All numbers are PROVISIONAL pending the
# cutover measurement.
#
#   --prefer (^|/)python[0-9.]*$  matches python, python3, python3.11 (a bare python$ missed python3)
#   -M 6500000,3500000   SIGTERM when available RAM < ~6.2G, SIGKILL < ~3.3G (KiB)
#   -S 6000000,3000000   SIGTERM when free swap < ~5.7G, SIGKILL < ~2.9G (of 64G) (KiB)
#   -g                   kill the victim's whole process group (kernels share the worker pgid)
#   -r 60                report every 60s so a slide toward the threshold is visible
#   -p                   earlyoom protects itself (own oom_score_adj); not a prefer/avoid flag
EARLYOOM_ARGS="-M 6500000,3500000 -S 6000000,3000000 -g -r 60 -p --prefer (^|/)python[0-9.]*$ --avoid (^|/)(sshd|systemd|earlyoom|prime-agent)$"
