# earlyoom drop-in (Deploy A). NOT applied by the fix branch. Install as
# /etc/sysconfig/earlyoom (OL8) or the distro's EARLYOOM_ARGS location, then restart
# earlyoom AFTER reviewing DEPLOY-A-RUNBOOK.md.
#
# WHY the shipped config is inert for us (VERIFIED 2026-09-15):
#   Shipped: -m 6,3 -s 8,4 -r 3600 -p  with --prefer '(^|/)(node|copilot|...)$'
#            and --avoid '(^|/)(...|python3|...|gateway)$'.
#   Our daemon supervisor and workers have comm `prime-agent`; our kernels have comm
#   `python`. So --avoid python3 does NOT match `python`, and --prefer node does NOT match
#   `prime-agent` (it instead prefers daemon-catalog-entry.js and unrelated node services).
#   And `-m 6` never trips under thrash because "available" (page cache) stays above 6% while
#   swap is exhausted, and BOTH thresholds must cross. Net: earlyoom never fired on freeze day.
#
# Retuned with ABSOLUTE thresholds in KiB for the 64G swap, comm-accurate regexes, and -g
# (kill the whole process group; our kernels share the worker pgid). Preferring `prime-agent`
# means the ROOT worker (the biggest process) is killed first; its kernels self-exit within
# ~1s via the repl owner-watchdog. Confirm the numbers against the host's real RAM before use.
#
#   -M 4000000,2000000  SIGTERM when free RAM < ~4G, SIGKILL < ~2G (KiB)
#   -S 40000000,20000000 SIGTERM when free swap < ~40G, SIGKILL < ~20G (of 64G) (KiB)
#   -g                   kill the victim's whole process group
#   -r 60                report every 60s so a slide toward the threshold is visible
#   -p                   prefer/avoid by /proc/<pid>/comm and cmdline
EARLYOOM_ARGS="-M 4000000,2000000 -S 40000000,20000000 -g -r 60 -p --prefer '(^|/)prime-agent$' --avoid '(^|/)(sshd|systemd|earlyoom)$'"
